name: repository-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python tools
        shell: pwsh
        run: python -m compileall -q tools

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parser errors in $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }

      - name: Verify release hygiene
        shell: pwsh
        run: |
          if ((Get-Content BUILD_VERSION.txt -Raw).Trim() -ne 'v0.14.0') { throw 'BUILD_VERSION.txt is not v0.14.0' }
          $forbidden = @(
            'required/CardsDLLzf.dll',
            'local.settings.json',
            'save/fut13-local.sqlite3',
            'data/fifa13-full-player-catalog.json',
            'data/fifa13-native-item-catalog.json',
            'src/bridge/secrets/gosredirector.key',
            'src/bridge/secrets/gosredirector.ea.com.pfx',
            'src/bridge/secrets/gosredirector.protossl.der'
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) { throw "Forbidden generated/proprietary file committed: $path" }
          }
          if (-not (Test-Path 'src/bridge/out/Fut13Local.Bridge.exe')) { throw 'Bundled bridge runtime is missing.' }
          if (-not (Test-Path 'src/trace-proxy/out/Fut13Local.TraceProxy.exe')) { throw 'Bundled trace-proxy runtime is missing.' }
          if (-not (Select-String -Path README.md -SimpleMatch '35BDAC6BB2F37F4E3F674C5BB979BCB607FEB11CD09105631796D566590FFC06' -Quiet)) {
            throw 'README does not document the required CL1298564 CardsDLL hash.'
          }
